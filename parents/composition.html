<style>*{margin:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:#fff}.scene-frame{position:absolute;inset:0;width:1920px;height:1080px;opacity:0;visibility:hidden;pointer-events:none;overflow:hidden}.scene-frame img,.scene-frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}.scene-frame img{z-index:2}img[hidden]{display:none}#transition-hold{position:absolute;inset:0;width:1920px;height:1080px;object-fit:contain;z-index:10;background:#fff;pointer-events:none}</style></head><body>
<script type="application/hyperframes-slideshow+json">{"slides": [{"sceneId": "slide-pc00", "startTime": 0, "endTime": 10, "fragments": [5], "notes": "PC00 · Title\n[The arrival loop runs while the room settles: the ribbon drifts and the three chips pulse.]\nWelcome — this is a working session of sorts: forty minutes on information literacy, and the habits underneath it.\n▶ Click: the fern."}, {"sceneId": "slide-b01", "startTime": 10, "endTime": 20, "fragments": [15], "notes": "B01 · Recursion\nNobody drew this fern.\nA computer took four tiny rules and fed each answer back in as the next question, over and over, and the leaf appeared.\nZoom in and you find the whole fern again. And again.\nThat's recursion: the same rule, applied to its own output.\n\n▶ Click: the rule comes out of the fern."}, {"sceneId": "slide-b02a", "startTime": 20, "endTime": 30, "fragments": [25], "notes": "B02a · Same rule (plays, then holds on the lungs)\nWatch the rule underneath the fern.\n[As it becomes rivers] The same rule makes a coastline: rivers splitting into smaller rivers, and every bay with smaller bays inside it.\n[As it turns into lungs] Turn it over and it's inside you: a pair of lungs. One tube splitting in two, and again, and again.\n\n▶ Click: a brain cell."}, {"sceneId": "slide-b02b", "startTime": 30, "endTime": 40, "fragments": [35], "notes": "B02b · A brain cell\nAnd it's the cell you're thinking with right now. It branches the same way, gathers signals, and passes one on.\nA second thought is that loop on purpose: your own thinking, fed back in.\n\n▶ Click: Now, AI."}, {"sceneId": "slide-b02c", "startTime": 40, "endTime": 50, "fragments": [45], "notes": "B02c · Now, AI\nNow, AI.\nIt's loosely modelled on those cells: layers of simple connections.\nIt makes a guess, checks how far off it was, adjusts its connections, and goes round again.\nThe same rule, applied to its own output.\n\n▶ Click: the turn."}, {"sceneId": "slide-b03", "startTime": 50, "endTime": 60, "fragments": [55], "notes": "B03 · The turn\nIf the machine recurses on knowledge, the value isn't in knowing.\n[Pause. Let it land. This slide is meant to be still.]\nAnd it's not just me saying that.\n\n▶ Click: Seymour Papert."}, {"sceneId": "slide-b04a", "startTime": 60, "endTime": 70, "fragments": [65], "notes": ""}, {"sceneId": "slide-b04b", "startTime": 70, "endTime": 80, "fragments": [75], "notes": ""}, {"sceneId": "slide-b04", "startTime": 80, "endTime": 90, "fragments": [85], "notes": "B04 · Watershed\n[Let the top-left Lineage card grow and flip into the MIT paper. Begin the next concept once the poster has opened and its quote arrives.]\nIn August, MIT's president, Sally Kornbluth, wrote to her whole community that AI in education is a watershed moment for MIT.\nAnd she quoted her own AI committee: responding to it is not an optional exercise.\nTheir report points to three things: education that is AI-aware, people and community, and continuous reflection.\n\n▶ Click: what MIT's students say."}, {"sceneId": "slide-b05a", "startTime": 90, "endTime": 100, "fragments": [95], "notes": "B05a · Three numbers\nHere's what MIT's own undergraduates said, in a survey by The Tech, their student paper, late last year.\n46 per cent use an AI chatbot every day.\n90 per cent worry they're becoming over-reliant on it.\n\n▶ Click: the third number."}, {"sceneId": "slide-b05b", "startTime": 100, "endTime": 110, "fragments": [105], "notes": "B05b · The third number\nAnd only 25 per cent think MIT is preparing them to use AI.\n[Pause.]\nThat's MIT. It's worth asking how our students would answer.\n\n▶ Click: so what do we teach?"}, {"sceneId": "slide-pc02", "startTime": 110, "endTime": 120, "fragments": [115], "notes": "PC02 · States\nGood thinking has conditions. Habits of mind shape how we approach information, AI, reading and creativity.\nWe call those conditions states. Everything today hangs off that claim: literacy work is state work.\n▶ Click: the portal into section one."}, {"sceneId": "slide-pc02b", "startTime": 120, "endTime": 130, "fragments": [125], "notes": ""}, {"sceneId": "slide-pc03", "startTime": 130, "endTime": 140, "fragments": [135], "notes": "PC03 · Thinking Routines\nThree stops: wellbeing, executive function, and AI as a thought partner.\nWellbeing comes first on purpose — before sources and search strings, the conditions that make evaluation possible.\n▶ Click: wellbeing."}, {"sceneId": "slide-pc04", "startTime": 140, "endTime": 150, "fragments": [145], "notes": "PC04 · Wellbeing first\nSleep. Attention. Emotions. Digital balance.\nParents often expect information literacy to begin with evaluating sources. I'd argue it begins earlier: in a state where thoughtful evaluation is possible.\n▶ Click: executive function."}, {"sceneId": "slide-pc05", "startTime": 150, "endTime": 160, "fragments": [155], "notes": "PC05 · Executive function\nTechnology is most powerful when it helps students manage their thinking — not replace it.\nNote-taking systems, calendars and task lists, timers and time boxes, reading workflows. This is the Sarah Ward territory: executive function, not gadgets.\nThe core skill: organizing attention.\n▶ Click: Flint."}, {"sceneId": "slide-pc05b", "startTime": 160, "endTime": 170, "fragments": [165], "notes": ""}, {"sceneId": "slide-pc06a", "startTime": 170, "endTime": 180, "fragments": [175], "notes": "PC06a · Flint — the worry\nHere's the use of AI that rightly worries parents: AI as replacement.\nWrite this for me. Give me the answer. Do the thinking.\n▶ Click: the other column."}, {"sceneId": "slide-pc06b", "startTime": 180, "endTime": 190, "fragments": [185], "notes": "PC06b · Flint — the partner\nAI as thought partner. Help me improve this. Help me understand. Extend my thinking.\nSame tool — the habit decides which column a student lives in.\n▶ Click: the bridge."}, {"sceneId": "slide-pc06c", "startTime": 190, "endTime": 200, "fragments": [195], "notes": ""}, {"sceneId": "slide-pc06d", "startTime": 200, "endTime": 210, "fragments": [205], "notes": ""}, {"sceneId": "slide-pc07", "startTime": 210, "endTime": 220, "fragments": [215], "notes": "PC07 · From thinking to creating\n[Let the navy field sit for a beat.]\nCreativity grows from strong thinking routines — reflection, questioning, reading, idea capture, conversation with AI.\n▶ Click: section two."}, {"sceneId": "slide-pc08", "startTime": 220, "endTime": 230, "fragments": [225], "notes": "PC08 · Creativity\nStrong creativity is not the opposite of structure. It grows from the routines we just walked through.\n▶ Click: reading."}, {"sceneId": "slide-pc09a", "startTime": 230, "endTime": 240, "fragments": [235], "notes": "PC09a · Why reading matters\nParents can see reading as competing with technology. I'd frame it as the original creativity technology.\nVocabulary. Background knowledge. Imagination and empathy. Ideas that connect. Every one of them feeds both human creativity and AI use.\n▶ Click: the payoff."}, {"sceneId": "slide-pc09b", "startTime": 240, "endTime": 250, "fragments": [245], "notes": "PC09b · Ideas worth remixing\nAI can remix ideas — students still need ideas worth remixing.\n▶ Click: what to put in the diet."}, {"sceneId": "slide-pc09c", "startTime": 250, "endTime": 260, "fragments": [255], "notes": ""}, {"sceneId": "slide-pc10", "startTime": 260, "endTime": 270, "fragments": [265], "notes": "PC10 · Better information diets\nThe point isn't these specific names — Sooth.fyi, The Economist, long-form journalism, books and newsletters.\nThe point is: information literacy depends on the quality of the information we consume.\n▶ Click: the turn."}, {"sceneId": "slide-pc10b", "startTime": 270, "endTime": 280, "fragments": [275], "notes": ""}, {"sceneId": "slide-pc11", "startTime": 280, "endTime": 290, "fragments": [285], "notes": "PC11 · Better questions\nWe often worry whether students know the right answers.\nWhat matters more: do they learn to ask better questions?\n▶ Click: the loop."}, {"sceneId": "slide-pc12", "startTime": 290, "endTime": 300, "fragments": [295], "notes": "PC12 · The loop\nLearn, think, create, question — repeat. Those habits are recursive.\nEvery day they shape how students learn, think, create, and participate in an AI-rich world.\n▶ Click: thanks."}, {"sceneId": "slide-pc13", "startTime": 300, "endTime": 310, "fragments": [305], "notes": "PC13 · Thank you\nQuestions welcome. The QR links to these slides and the resources once they're posted.\n[End.]"}]}</script>

</section><img id="transition-hold" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="" aria-hidden="true" data-layout-ignore hidden><script>window.DECK={"title": "Media & Information Technology", "conference": "Parent Coffee", "date": "18 November 2026", "sourceFps": 30, "slides": [{"id": "PC00", "sceneId": "slide-pc00", "title": "Media and information technology", "startFrame": 0, "endFrame": 195, "frames": 195, "duration": 6.5, "timer": false, "media": "media/01-pc00.mp4", "poster": "posters/01-pc00.png", "notes": "PC00 · Title\n[The arrival loop runs while the room settles: the ribbon drifts and the three chips pulse.]\nWelcome — this is a working session of sorts: forty minutes on information literacy, and the habits underneath it.\n▶ Click: the fern."}, {"id": "B01", "sceneId": "slide-b01", "title": "Recursion", "startFrame": 195, "endFrame": 465, "frames": 270, "duration": 9.0, "timer": false, "media": "media/02-b01.mp4", "poster": "posters/02-b01.png", "notes": "B01 · Recursion\nNobody drew this fern.\nA computer took four tiny rules and fed each answer back in as the next question, over and over, and the leaf appeared.\nZoom in and you find the whole fern again. And again.\nThat's recursion: the same rule, applied to its own output.\n\n▶ Click: the rule comes out of the fern."}, {"id": "B02a", "sceneId": "slide-b02a", "title": "Same rule", "startFrame": 465, "endFrame": 681, "frames": 216, "duration": 7.2, "timer": false, "media": "media/03-b02a.mp4", "poster": "posters/03-b02a.png", "notes": "B02a · Same rule (plays, then holds on the lungs)\nWatch the rule underneath the fern.\n[As it becomes rivers] The same rule makes a coastline: rivers splitting into smaller rivers, and every bay with smaller bays inside it.\n[As it turns into lungs] Turn it over and it's inside you: a pair of lungs. One tube splitting in two, and again, and again.\n\n▶ Click: a brain cell."}, {"id": "B02b", "sceneId": "slide-b02b", "title": "Same rule, part 2", "startFrame": 681, "endFrame": 753, "frames": 72, "duration": 2.4, "timer": false, "media": "media/04-b02b.mp4", "poster": "posters/04-b02b.png", "notes": "B02b · A brain cell\nAnd it's the cell you're thinking with right now. It branches the same way, gathers signals, and passes one on.\nA second thought is that loop on purpose: your own thinking, fed back in.\n\n▶ Click: Now, AI."}, {"id": "B02c", "sceneId": "slide-b02c", "title": "Now, AI", "startFrame": 753, "endFrame": 884, "frames": 131, "duration": 4.366666666666666, "timer": false, "media": "media/05-b02c.mp4", "poster": "posters/05-b02c.png", "notes": "B02c · Now, AI\nNow, AI.\nIt's loosely modelled on those cells: layers of simple connections.\nIt makes a guess, checks how far off it was, adjusts its connections, and goes round again.\nThe same rule, applied to its own output.\n\n▶ Click: the turn."}, {"id": "B03", "sceneId": "slide-b03", "title": "The turn", "startFrame": 884, "endFrame": 944, "frames": 60, "duration": 2.0, "timer": false, "media": "media/06-b03.mp4", "poster": "posters/06-b03.png", "notes": "B03 · The turn\nIf the machine recurses on knowledge, the value isn't in knowing.\n[Pause. Let it land. This slide is meant to be still.]\nAnd it's not just me saying that.\n\n▶ Click: Seymour Papert."}, {"id": "B04A", "sceneId": "slide-b04a", "title": "Seymour Papert", "startFrame": 944, "endFrame": 1364, "frames": 420, "duration": 14.0, "timer": false, "media": "media/07-b04a.mp4", "poster": "posters/07-b04a.png", "notes": ""}, {"id": "B04B", "sceneId": "slide-b04b", "title": "Lineage", "startFrame": 1364, "endFrame": 1964, "frames": 600, "duration": 20.0, "timer": false, "media": "media/08-b04b.mp4", "poster": "posters/08-b04b.png", "notes": ""}, {"id": "B04", "sceneId": "slide-b04", "title": "Watershed", "startFrame": 1964, "endFrame": 2144, "frames": 180, "duration": 6.0, "timer": false, "media": "media/09-b04.mp4", "poster": "posters/09-b04.png", "notes": "B04 · Watershed\n[Let the top-left Lineage card grow and flip into the MIT paper. Begin the next concept once the poster has opened and its quote arrives.]\nIn August, MIT's president, Sally Kornbluth, wrote to her whole community that AI in education is a watershed moment for MIT.\nAnd she quoted her own AI committee: responding to it is not an optional exercise.\nTheir report points to three things: education that is AI-aware, people and community, and continuous reflection.\n\n▶ Click: what MIT's students say."}, {"id": "B05a", "sceneId": "slide-b05a", "title": "Three numbers", "startFrame": 2144, "endFrame": 2205, "frames": 61, "duration": 2.033333333333333, "timer": false, "media": "media/10-b05a.mp4", "poster": "posters/10-b05a.png", "notes": "B05a · Three numbers\nHere's what MIT's own undergraduates said, in a survey by The Tech, their student paper, late last year.\n46 per cent use an AI chatbot every day.\n90 per cent worry they're becoming over-reliant on it.\n\n▶ Click: the third number."}, {"id": "B05b", "sceneId": "slide-b05b", "title": "Removing the barrier", "startFrame": 2205, "endFrame": 2324, "frames": 119, "duration": 3.966666666666667, "timer": false, "media": "media/11-b05b.mp4", "poster": "posters/11-b05b.png", "notes": "B05b · The third number\nAnd only 25 per cent think MIT is preparing them to use AI.\n[Pause.]\nThat's MIT. It's worth asking how our students would answer.\n\n▶ Click: so what do we teach?"}, {"id": "PC02", "sceneId": "slide-pc02", "title": "States", "startFrame": 2324, "endFrame": 2548, "frames": 224, "duration": 7.466666666666667, "timer": false, "media": "media/12-pc02.mp4", "poster": "posters/12-pc02.png", "notes": "PC02 · States\nGood thinking has conditions. Habits of mind shape how we approach information, AI, reading and creativity.\nWe call those conditions states. Everything today hangs off that claim: literacy work is state work.\n▶ Click: the portal into section one."}, {"id": "PC02B", "sceneId": "slide-pc02b", "title": "From states to routines", "startFrame": 2548, "endFrame": 2744, "frames": 196, "duration": 6.533333333333333, "timer": false, "media": "media/13-pc02b.mp4", "poster": "posters/13-pc02b.png", "notes": ""}, {"id": "PC03", "sceneId": "slide-pc03", "title": "Section 1: Thinking routines", "startFrame": 2744, "endFrame": 2938, "frames": 194, "duration": 6.466666666666667, "timer": false, "media": "media/14-pc03.mp4", "poster": "posters/14-pc03.png", "notes": "PC03 · Thinking Routines\nThree stops: wellbeing, executive function, and AI as a thought partner.\nWellbeing comes first on purpose — before sources and search strings, the conditions that make evaluation possible.\n▶ Click: wellbeing."}, {"id": "PC04", "sceneId": "slide-pc04", "title": "Wellbeing first", "startFrame": 2938, "endFrame": 3208, "frames": 270, "duration": 9.0, "timer": false, "media": "media/15-pc04.mp4", "poster": "posters/15-pc04.png", "notes": "PC04 · Wellbeing first\nSleep. Attention. Emotions. Digital balance.\nParents often expect information literacy to begin with evaluating sources. I'd argue it begins earlier: in a state where thoughtful evaluation is possible.\n▶ Click: executive function."}, {"id": "PC05", "sceneId": "slide-pc05", "title": "Executive function", "startFrame": 3208, "endFrame": 3508, "frames": 300, "duration": 10.0, "timer": false, "media": "media/16-pc05.mp4", "poster": "posters/16-pc05.png", "notes": "PC05 · Executive function\nTechnology is most powerful when it helps students manage their thinking — not replace it.\nNote-taking systems, calendars and task lists, timers and time boxes, reading workflows. This is the Sarah Ward territory: executive function, not gadgets.\nThe core skill: organizing attention.\n▶ Click: Flint."}, {"id": "PC05B", "sceneId": "slide-pc05b", "title": "In practice: student workflows", "startFrame": 3508, "endFrame": 3778, "frames": 270, "duration": 9.0, "timer": false, "media": "media/17-pc05b.mp4", "poster": "posters/17-pc05b.png", "notes": ""}, {"id": "PC06a", "sceneId": "slide-pc06a", "title": "", "startFrame": 3778, "endFrame": 3934, "frames": 156, "duration": 5.2, "timer": false, "media": "media/18-pc06a.mp4", "poster": "posters/18-pc06a.png", "notes": "PC06a · Flint — the worry\nHere's the use of AI that rightly worries parents: AI as replacement.\nWrite this for me. Give me the answer. Do the thinking.\n▶ Click: the other column."}, {"id": "PC06b", "sceneId": "slide-pc06b", "title": "", "startFrame": 3934, "endFrame": 4108, "frames": 174, "duration": 5.8, "timer": false, "media": "media/19-pc06b.mp4", "poster": "posters/19-pc06b.png", "notes": "PC06b · Flint — the partner\nAI as thought partner. Help me improve this. Help me understand. Extend my thinking.\nSame tool — the habit decides which column a student lives in.\n▶ Click: the bridge."}, {"id": "PC06C", "sceneId": "slide-pc06c", "title": "The Socratic prompt", "startFrame": 4108, "endFrame": 4378, "frames": 270, "duration": 9.0, "timer": false, "media": "media/20-pc06c.mp4", "poster": "posters/20-pc06c.png", "notes": ""}, {"id": "PC06D", "sceneId": "slide-pc06d", "title": "Flint in action", "startFrame": 4378, "endFrame": 4678, "frames": 300, "duration": 10.0, "timer": false, "media": "media/21-pc06d.mp4", "poster": "posters/21-pc06d.png", "notes": ""}, {"id": "PC07", "sceneId": "slide-pc07", "title": "From thinking to creating", "startFrame": 4678, "endFrame": 4874, "frames": 196, "duration": 6.533333333333333, "timer": false, "media": "media/22-pc07.mp4", "poster": "posters/22-pc07.png", "notes": "PC07 · From thinking to creating\n[Let the navy field sit for a beat.]\nCreativity grows from strong thinking routines — reflection, questioning, reading, idea capture, conversation with AI.\n▶ Click: section two."}, {"id": "PC08", "sceneId": "slide-pc08", "title": "Section 2: Creativity", "startFrame": 4874, "endFrame": 5068, "frames": 194, "duration": 6.466666666666667, "timer": false, "media": "media/23-pc08.mp4", "poster": "posters/23-pc08.png", "notes": "PC08 · Creativity\nStrong creativity is not the opposite of structure. It grows from the routines we just walked through.\n▶ Click: reading."}, {"id": "PC09a", "sceneId": "slide-pc09a", "title": "", "startFrame": 5068, "endFrame": 5260, "frames": 192, "duration": 6.4, "timer": false, "media": "media/24-pc09a.mp4", "poster": "posters/24-pc09a.png", "notes": "PC09a · Why reading matters\nParents can see reading as competing with technology. I'd frame it as the original creativity technology.\nVocabulary. Background knowledge. Imagination and empathy. Ideas that connect. Every one of them feeds both human creativity and AI use.\n▶ Click: the payoff."}, {"id": "PC09b", "sceneId": "slide-pc09b", "title": "", "startFrame": 5260, "endFrame": 5428, "frames": 168, "duration": 5.6, "timer": false, "media": "media/25-pc09b.mp4", "poster": "posters/25-pc09b.png", "notes": "PC09b · Ideas worth remixing\nAI can remix ideas — students still need ideas worth remixing.\n▶ Click: what to put in the diet."}, {"id": "PC09C", "sceneId": "slide-pc09c", "title": "The idea remix", "startFrame": 5428, "endFrame": 5714, "frames": 286, "duration": 9.533333333333333, "timer": false, "media": "media/26-pc09c.mp4", "poster": "posters/26-pc09c.png", "notes": ""}, {"id": "PC10", "sceneId": "slide-pc10", "title": "Better information diets", "startFrame": 5714, "endFrame": 5968, "frames": 254, "duration": 8.466666666666667, "timer": false, "media": "media/27-pc10.mp4", "poster": "posters/27-pc10.png", "notes": "PC10 · Better information diets\nThe point isn't these specific names — Sooth.fyi, The Economist, long-form journalism, books and newsletters.\nThe point is: information literacy depends on the quality of the information we consume.\n▶ Click: the turn."}, {"id": "PC10B", "sceneId": "slide-pc10b", "title": "Spotlight: Sooth.fyi", "startFrame": 5968, "endFrame": 6268, "frames": 300, "duration": 10.0, "timer": false, "media": "media/28-pc10b.mp4", "poster": "posters/28-pc10b.png", "notes": ""}, {"id": "PC11", "sceneId": "slide-pc11", "title": "Better questions", "startFrame": 6268, "endFrame": 6508, "frames": 240, "duration": 8.0, "timer": false, "media": "media/29-pc11.mp4", "poster": "posters/29-pc11.png", "notes": "PC11 · Better questions\nWe often worry whether students know the right answers.\nWhat matters more: do they learn to ask better questions?\n▶ Click: the loop."}, {"id": "PC12", "sceneId": "slide-pc12", "title": "The loop", "startFrame": 6508, "endFrame": 6824, "frames": 316, "duration": 10.533333333333333, "timer": false, "media": "media/30-pc12.mp4", "poster": "posters/30-pc12.png", "notes": "PC12 · The loop\nLearn, think, create, question — repeat. Those habits are recursive.\nEvery day they shape how students learn, think, create, and participate in an AI-rich world.\n▶ Click: thanks."}, {"id": "PC13", "sceneId": "slide-pc13", "title": "Thank you", "startFrame": 6824, "endFrame": 7019, "frames": 195, "duration": 6.5, "timer": false, "media": "media/31-pc13.mp4", "poster": "posters/31-pc13.png", "notes": "PC13 · Thank you\nQuestions welcome. The QR links to these slides and the resources once they're posted.\n[End.]"}], "playerVersion": "0.8.81"};window.__timelines=window.__timelines||{};window.__timelines["slide-pc00"]=gsap.timeline({paused:true}).to({},{duration:310});</script><script src="frame-player.js?v=20261106-motion"></script></body></html>
