<script type="application/hyperframes-slideshow+json">{"slides": [{"sceneId": "slide-b00", "startTime": 0, "endTime": 10, "fragments": [5], "notes": "B00 · Title\n[Start the show before people arrive. The title plays once, then runs straight into the holding loop by itself.]\n\nB00 · Holding loop (loops while the room arrives)\nAs people come in:\nWelcome, everyone. Grab a seat, open the laptop you brought, and check you can access at least one AI available in your region. We will explore Automate, WebApp and Agents together.\n\n[When everyone's in, click to begin.]\n▶ Click: the fern."}, {"sceneId": "slide-b01", "startTime": 10, "endTime": 20, "fragments": [15], "notes": "B01 · Recursion\nNobody drew this fern.\nA computer took four tiny rules and fed each answer back in as the next question, over and over, and the leaf appeared.\nZoom in and you find the whole fern again. And again.\nThat's recursion: the same rule, applied to its own output.\n\n▶ Click: the rule comes out of the fern."}, {"sceneId": "slide-b02a", "startTime": 20, "endTime": 30, "fragments": [25], "notes": "B02a · Same rule (plays, then holds on the lungs)\nWatch the rule underneath the fern.\n[As it becomes rivers] The same rule makes a coastline: rivers splitting into smaller rivers, and every bay with smaller bays inside it.\n[As it turns into lungs] Turn it over and it's inside you: a pair of lungs. One tube splitting in two, and again, and again.\n\n▶ Click: a brain cell."}, {"sceneId": "slide-b02b", "startTime": 30, "endTime": 40, "fragments": [35], "notes": "B02b · A brain cell\nAnd it's the cell you're thinking with right now. It branches the same way, gathers signals, and passes one on.\nA second thought is that loop on purpose: your own thinking, fed back in.\n\n▶ Click: Now, AI."}, {"sceneId": "slide-b02c", "startTime": 40, "endTime": 50, "fragments": [45], "notes": "B02c · Now, AI\nNow, AI.\nIt's loosely modelled on those cells: layers of simple connections.\nIt makes a guess, checks how far off it was, adjusts its connections, and goes round again.\nThe same rule, applied to its own output.\n\n▶ Click: the turn."}, {"sceneId": "slide-b03", "startTime": 50, "endTime": 60, "fragments": [55], "notes": "B03 · The turn\nIf the machine recurses on knowledge, the value isn't in knowing.\n[Pause. Let it land. This slide is meant to be still.]\nAnd it's not just me saying that.\n\n▶ Click: Seymour Papert."}, {"sceneId": "slide-b04a", "startTime": 60, "endTime": 70, "fragments": [65], "notes": "B04a · Seymour Papert\nThis is Seymour Papert.\nI learnt to code visually through Turtle Art. It allowed me to understand recursion in a way I couldn't through the mathematics alone.\n[Let his portrait draw first. Follow its line into the recursive tree. Use the visual to tell your own learning story; save the Lineage introduction for the next scene.]\n\n▶ Click: the Lineage card activity."}, {"sceneId": "slide-b04b", "startTime": 70, "endTime": 80, "fragments": [75], "notes": "B04b · Lineage · Card activity\n[Let the portrait-and-tree line become the tangled pattern and resolve into a card back. Introduce Lineage after the card is recognisable, then explain the activity as the text arrives.]\nIn your groups, shuffle the cards and lay out ten cards face down.\nTwo of those ten cards are our jokers: Elon Musk and Rick Rubin.\nTake turns turning over the cards.\n[Let the sequential card flips demonstrate taking turns; the cards then return face down. Hold while the groups do the activity. Point to the highlighted word turns. The link to LLM turns is for your later explanation; do not introduce an extra scoring rule, stopping rule or reveal it automatically.]\n\n▶ Click: MIT."}, {"sceneId": "slide-b04", "startTime": 80, "endTime": 90, "fragments": [85], "notes": "B04 · Watershed\n[Let the top-left Lineage card grow and flip into the MIT paper. Begin the next concept once the poster has opened and its quote arrives.]\nIn August, MIT's president, Sally Kornbluth, wrote to her whole community that AI in education is a watershed moment for MIT.\nAnd she quoted her own AI committee: responding to it is not an optional exercise.\nTheir report points to three things: education that is AI-aware, people and community, and continuous reflection.\n\n▶ Click: what MIT's students say."}, {"sceneId": "slide-b05a", "startTime": 90, "endTime": 100, "fragments": [95], "notes": "B05a · Three numbers\nHere's what MIT's own undergraduates said, in a survey by The Tech, their student paper, late last year.\n46 per cent use an AI chatbot every day.\n90 per cent worry they're becoming over-reliant on it.\n\n▶ Click: the third number."}, {"sceneId": "slide-b05b", "startTime": 100, "endTime": 110, "fragments": [105], "notes": "B05b · The third number\nAnd only 25 per cent think MIT is preparing them to use AI.\n[Pause.]\nThat's MIT. It's worth asking how our students would answer.\n\n▶ Click: so what do we teach?"}, {"sceneId": "slide-b05ta", "startTime": 110, "endTime": 120, "fragments": [115], "notes": "B05Ta · So we teach\nSo what do we teach?\nThinking routines.\nAnd creativity.\nThat's where the value is now.\n\n▶ Click: why we start with reflection."}, {"sceneId": "slide-b05tb", "startTime": 120, "endTime": 130, "fragments": [125], "notes": "B05Tb · Why we start with reflection\nThis is why we start with reflection: to find the problems worth solving, before anyone touches a tool.\n\n▶ Click: the loop we'll run today."}, {"sceneId": "slide-b05l", "startTime": 130, "endTime": 140, "fragments": [135], "notes": "B05L · The loop, first\nHere's the loop we'll run today, twice.\nFind a barrier. Sketch it. Write the prompt. Build it. Test it. Then go round again.\nHold on to this shape. You'll see it again at the end.\n\n▶ Click: the question."}, {"sceneId": "slide-b06", "startTime": 140, "endTime": 150, "fragments": [145], "notes": "B06 · The question\nHoma Tavangar puts it this way: the question is no longer \"What do you know?\"\nIt's this.\nWhat problems do you want to solve?\n[Pause.]\n\n▶ Click: two kinds of problem."}, {"sceneId": "slide-b07-1", "startTime": 150, "endTime": 160, "fragments": [155], "notes": "B07-1 · Algorithmic vs heuristic\nThere are two kinds of problem.\nAlgorithmic problems have a known procedure. Follow the steps, get the answer.\nHeuristic problems don't. There's no procedure, just rules of thumb, judgment and trial. You know you've arrived when you look at it.\n\n▶ Click: which one AI has eaten."}, {"sceneId": "slide-b07-2", "startTime": 160, "endTime": 170, "fragments": [165], "notes": "B07-2 · The payoff\nAI has eaten the first kind.\nAnd every hard problem in your classroom is on the right.\nThat's why nobody has built the tool you need, and why you're the only one who can.\n\n▶ Click: Rick Rubin."}, {"sceneId": "slide-b07a", "startTime": 170, "endTime": 180, "fragments": [175], "notes": "B07a · Rick Rubin\n[Follow the heuristic line as it continues into Rick Rubin's portrait. Explain his relationship to vibe coding in your own words; then connect Automate, WebApp and Agents to the three workshop exercises.]\n[Background source for preparation: Rick Rubin's The Way of Code, https://www.thewayofcode.com/ . The portrait and story reference are retained from the Lineage project.]\n\n▶ Click: warm-up, Round 1 — through the existing ribbon transition."}, {"sceneId": "slide-b08", "startTime": 180, "endTime": 190, "fragments": [185], "notes": "B08 · Round 1\nLet's warm up. This comes from Creative Hustle, by Olatunde Sobomehin and Sam Seidel.\nWrite the most ridiculous word you can think of.\nNow stand up and find someone you don't work with.\nPitch them a product with that name. You have three minutes.\n\n▶ Click: start the three-minute Round 1 timer."}, {"sceneId": "slide-b08a", "startTime": 190, "endTime": 200, "fragments": [195], "notes": "B08a · Round 1 timer\n[The persistent step-three reminder reads: Pitch a product with that name.]\n[The countdown runs from 03:00 to 00:00 over exactly 180 seconds. Give the room the full activity time. The completed picture and 00:00 hold until you advance.]\n[The wordless line moves through the song’s imagery, then finishes on Jay-Z’s face from the supplied reference. Background music: the supplied 99 Problems instrumental, cropped to the first three minutes, with a two-second fade to silence at the end.]\n\n▶ Click: Round 2."}, {"sceneId": "slide-b09", "startTime": 200, "endTime": 210, "fragments": [205], "notes": "B09 · Round 2\nRound 2. Now write your real classroom problem, in one sentence.\nFind a new partner. Pitch each other a solution. You have four minutes.\n\n▶ Click: start the four-minute Round 2 timer."}, {"sceneId": "slide-b09a", "startTime": 210, "endTime": 220, "fragments": [215], "notes": "B09a · Round 2 timer\n[The countdown runs from 04:00 to 00:00 over exactly 240 seconds. The third instruction remains visible: Pitch each other a solution. Give the room the full activity time, then bring everyone back to their seats.]\n[The line moves through city and bridge imagery and resolves into the supplied Red Hot Chili Peppers illustration. The supplied Under the Bridge instrumental plays for four minutes, with a two-second closing fade.]\n\n▶ Click: deficit."}, {"sceneId": "slide-b10-1", "startTime": 220, "endTime": 230, "fragments": [225], "notes": "B10-1 · Deficit\nHere's how most of us write a problem down:\nThey can't organise their writing.\nThat's a deficit. It lives in the student.\n\n▶ Click: the same problem as a barrier."}, {"sceneId": "slide-b10-2", "startTime": 230, "endTime": 240, "fragments": [235], "notes": "B10-2 · Barrier\nNow the same thing as a barrier:\nThe organising has to happen in their head at the same time as the writing.\nSame student. Different problem. Only one of them is yours to fix.\n[Optional: it's the same move as our UDL work. The barrier is in the design, not the learner.]\n\n▶ Click: introduce Apple Shortcuts."}, {"sceneId": "slide-b10a", "startTime": 240, "endTime": 250, "fragments": [245], "notes": "B10a · Apple Shortcuts\n[Introduce Apple Shortcuts as the first tool, connecting it to Automate from the opening. Use the supplied screenshot in the MacBook frame. The ribbon arrow points to the right-hand “What do you want your shortcut to do?” panel.]\n\n▶ Click: the student notetaking example."}, {"sceneId": "slide-b10b", "startTime": 250, "endTime": 260, "fragments": [255], "notes": "B10b · Student notetaking\n[Show the example you created in Shortcuts to support student notetaking. The left iPad shows the notes output, the centre iPad shows the Class Notes shortcut, and the right iPad shows the notes share sheet with Class Notes.]\n\n▶ Click: your turn."}, {"sceneId": "slide-b11", "startTime": 260, "endTime": 270, "fragments": [265], "notes": "B11 · Your turn\nYour turn. Take your one-sentence problem from Round 2 and rewrite it with this template:\nBlank can't blank. The blank has to happen at the same time as blank.\nThen sketch it. Three minutes. Boxes and arrows.\nAnswer three questions:\nWhat does the student see first?\nWhat can they do on it?\nWhat happens when they tap?\n[Use the next scene’s three-minute timer.]\n\n▶ Click: start the sketch timer."}, {"sceneId": "slide-b11a", "startTime": 270, "endTime": 280, "fragments": [275], "notes": "B11a · Sketch timer\n[Give the room the full three minutes to sketch. The reminder reads: Sketch it. Boxes and arrows.]\n[The supplied Shape of You instrumental accompanies the countdown. Wordless line imagery resolves into Ed Sheeran’s portrait from the supplied reference. The music fades during the last two seconds, then the completed frame holds until you advance.]\n\n▶ Click: your prompt."}, {"sceneId": "slide-b13", "startTime": 280, "endTime": 290, "fragments": [285], "notes": "B13 · Prompt spine\nThis is your prompt. Fill in the blanks from your sketch:\nBuild a single-screen tool for a Grade blank student who blank.\nShow blank first, then let them blank.\nKeep the language at blank. No sign-in.\nWrite it down. You'll paste it in a minute, and it stays on the build slide too.\n\n▶ Click: examples."}, {"sceneId": "slide-b14", "startTime": 290, "endTime": 300, "fragments": [295], "notes": "B14 · Examples\nHere are examples of what we can explore: interactives, explainer videos and Agentic updates.\nAnd your materials are the boundary: it works from what you give it.\nToday we will explore a small Web App. We are not promising a completed app.\n\n[Before you go on, pair up. Say what it's for before anyone moves: everyone works with someone whose habits are different from theirs.\nHave everyone line up by how much of their week already runs through an AI tool: \"never\" at one end, \"it's in everything\" at the other.\nThen fold the line: the front person pairs with the back, second with second-last.]\n\n▶ Click: chatbots and Gemini."}, {"sceneId": "slide-b14a", "startTime": 300, "endTime": 310, "fragments": [305], "notes": "B14a · Chatbots · Gemini\nIntroduce chatbots using Gemini as the presenter's chosen example.\n[Supplied Gemini screenshot: Turtle Art coding-platform prompt and generated artifact.]\n\n▶ Click: Biology example."}, {"sceneId": "slide-b14b", "startTime": 310, "endTime": 320, "fragments": [315], "notes": "B14B · Biology\nHere's what this can look like when you keep going.\nThis is a Grade 9 biology resource I built: the readings, a glossary that shows how the words connect, and a body index.\nIt's at dbbudd.github.io/biology if you want to explore it later.\nYou're not building this today. You're building the first, smallest version of yours.\n\n▶ Click: BUILD 01."}, {"sceneId": "slide-b15", "startTime": 320, "endTime": 330, "fragments": [325], "notes": "B15 · BUILD 01 · Web App · 15 minutes\nFifteen minutes to build a Web App.\nOne of you drives, one of you talks. Your prompt is bottom left.\nYour first version will be wrong. That's the point. Go.\n[The next board has the matching fifteen-minute timer and supplied FOLHK music mix.]\n\n▶ Click: build timer."}, {"sceneId": "slide-b15a", "startTime": 330, "endTime": 340, "fragments": [335], "notes": "B15a · Web App timer · 15 minutes\nOne drives. One talks.\n[Fifteen-minute timer with the full supplied FOLHK mix at its original level and speed. Song-led line imagery follows Black Skinhead, The Pretender and Dani California, finishing on the supplied three-singer portrait. The last half-second hold is quiet.]\n\n▶ Click: TEST 01."}, {"sceneId": "slide-b16", "startTime": 340, "endTime": 350, "fragments": [345], "notes": "B16 · TEST 01 · Web App · 4 minutes\nStop building. Swap devices with another pair.\nThey use it cold. You say nothing.\nWatch where they hesitate.\n[Start a 4-minute timer.]\n\n▶ Click: what it couldn't do."}, {"sceneId": "slide-b17", "startTime": 350, "endTime": 360, "fragments": [355], "notes": "B17 · What it couldn't do\nWith your partner: what did you want it to do that it wouldn't?\n[Give them a minute, then take answers and write them on the slide with the pen.]\n\n▶ Click: SCAMPER."}, {"sceneId": "slide-b17sa", "startTime": 360, "endTime": 370, "fragments": [365], "notes": "B17Sa · SCAMPER\nHere's a tool for pushing an idea further: SCAMPER.\nSubstitute. Combine. Adapt. Modify. Put to another use. Eliminate. Reverse.\n\n▶ Click: today's three."}, {"sceneId": "slide-b17sb", "startTime": 370, "endTime": 380, "fragments": [375], "notes": "B17Sb · Today's three\nToday we'll use three of them: Substitute, Combine and Eliminate.\n\n▶ Click: the corners."}, {"sceneId": "slide-b18", "startTime": 380, "endTime": 390, "fragments": [385], "notes": "B18 · Three corners\nThis is the room from above. The bar at the top is this screen.\nEach corner is one move: Substitute, Combine, Eliminate.\nAnd if yours already works, take the fourth corner: push it.\nChange one thing.\n[Give them four minutes to swap ideas with the others in their corner; the next board manages the time.]\n\n▶ Click: four-minute activity timer."}, {"sceneId": "slide-b18a", "startTime": 390, "endTime": 400, "fragments": [395], "notes": "B18a · Four-minute SCAMPER activity\nSubstitute - Combine - Eliminate - Push It!\n[Four-minute countdown. Rolling in the Deep imagery leads to Adele from the supplied reference. The activity instruction stays visible. The supplied Rolling in the Deep instrumental plays at its original speed, fades out, and is padded with silence to complete the four minutes.]\n\n▶ Click: Web App to Agents."}, {"sceneId": "slide-b19a", "startTime": 400, "endTime": 410, "fragments": [405], "notes": "B19a · Web App to Agents\nHere are the next three capabilities I want to demonstrate:\nAccess Local Files.\nCreate Skills.\nAutomate Workflows.\n[The three items begin under Can’t / Web App.]\n\n▶ Click: move the capabilities to Agents."}, {"sceneId": "slide-b19b", "startTime": 410, "endTime": 420, "fragments": [415], "notes": "B19b · Agents can\n[The three capabilities move into Can / Agents, one at a time.]\nAccess Local Files. Create Skills. Automate Workflows.\n\n▶ Click: three words."}, {"sceneId": "slide-b12", "startTime": 420, "endTime": 430, "fragments": [425], "notes": "B12 · Three words\nThree words before we explore Agents.\nAn app is anything you open and use. It doesn't need to be in an App Store.\nHTML is the structure: boxes, text, where things sit.\nJavaScript is the behaviour: what happens when you press the thing.\nYou write neither. You describe the behaviour.\n\n▶ Click: BUILD 02."}, {"sceneId": "slide-b20", "startTime": 430, "endTime": 440, "fragments": [435], "notes": "B20 · BUILD 02 · Agents · 8 minutes\nEight minutes, with agents. Swap roles: whoever talked now drives.\nSame barrier. More ambition.\nNobody finishes this. You're finding out if it's buildable. Go.\n[Start an 8-minute timer. Walk the room.]\n\n▶ Click: Xcode."}, {"sceneId": "slide-b20a", "startTime": 440, "endTime": 450, "fragments": [445], "notes": "B20a · Agents · Xcode\nIntroduce Agents using Xcode.\n[Supplied Xcode screenshot: Margins project and Coding Intelligence / Agents settings.]\n\n▶ Click: Copilot."}, {"sceneId": "slide-b20b", "startTime": 450, "endTime": 460, "fragments": [455], "notes": "B20b · Agents · Copilot\nIntroduce Agents using Copilot.\n[Supplied Copilot screenshot: creating an HKIS HyperFrames personal skill in OneDrive.]\n\n▶ Click: DeepSeek."}, {"sceneId": "slide-b20c", "startTime": 460, "endTime": 470, "fragments": [465], "notes": "B20c · Agents · DeepSeek\nIntroduce Agents using DeepSeek.\n[Supplied DeepSeek Harness screenshot: Margins app running in the simulator beside the agent conversation.]\n\n▶ Click: Margins."}, {"sceneId": "slide-b21", "startTime": 470, "endTime": 480, "fragments": [475], "notes": "B21 · Margins\nOne example of where this goes.\nThis is Margins. I built this because I saw how ELA teachers struggled with grading workflows.\nThe AI runs on the iPad itself. The writing never leaves the iPad.\n\n▶ Click: the third rung."}, {"sceneId": "slide-b22", "startTime": 480, "endTime": 490, "fragments": [485], "notes": "B22 · The third rung\nAutomate. Then Web App.\nThe third rung is Agents: Copilot, DeepSeek and Xcode.\nUp there, the tool stops being the limit.\nYou become the limit.\n\n▶ Click: Build 02."}, {"sceneId": "slide-b22a", "startTime": 490, "endTime": 500, "fragments": [495], "notes": "B22a · Build 02\nSame barrier. More ambition.\nContinue iterating.\n[The 8 turns sideways, then a red line crosses out minutes. Hold this board while the room continues.]\n\n▶ Click: the loop."}, {"sceneId": "slide-b23", "startTime": 500, "endTime": 510, "fragments": [505], "notes": "B23 · The loop\nRemember this loop? Barrier. Sketch. Prompt. Build. Test.\nYou just ran this twice.\nRun it again Monday.\n\n▶ Click: the question."}, {"sceneId": "slide-b24", "startTime": 510, "endTime": 520, "fragments": [515], "notes": "B24 · What next\nSo:\nWhat problem do you want to solve next?\n[Pause. Let it sit.]\n\n[Last slide. Hold this question on screen.]"}]}</script>

</section><img id="transition-hold" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="" aria-hidden="true" data-layout-ignore hidden><script>window.DECK={"title": "Stop Waiting for the Perfect App", "conference": "Future of Learning", "date": "14 November 2026", "sourceFps": 30, "slides": [{"id": "B00", "sceneId": "slide-b00", "title": "Title", "startFrame": 0, "endFrame": 120, "frames": 120, "duration": 4.0, "timer": false, "media": "media/01-b00.mp4", "poster": "posters/01-b00.png", "notes": "B00 · Title\n[Start the show before people arrive. The title plays once, then runs straight into the holding loop by itself.]\n\nB00 · Holding loop (loops while the room arrives)\nAs people come in:\nWelcome, everyone. Grab a seat, open the laptop you brought, and check you can access at least one AI available in your region. We will explore Automate, WebApp and Agents together.\n\n[When everyone's in, click to begin.]\n▶ Click: the fern."}, {"id": "B01", "sceneId": "slide-b01", "title": "Recursion", "startFrame": 120, "endFrame": 390, "frames": 270, "duration": 9.0, "timer": false, "media": "media/02-b01.mp4", "poster": "posters/02-b01.png", "notes": "B01 · Recursion\nNobody drew this fern.\nA computer took four tiny rules and fed each answer back in as the next question, over and over, and the leaf appeared.\nZoom in and you find the whole fern again. And again.\nThat's recursion: the same rule, applied to its own output.\n\n▶ Click: the rule comes out of the fern."}, {"id": "B02a", "sceneId": "slide-b02a", "title": "Same rule", "startFrame": 390, "endFrame": 606, "frames": 216, "duration": 7.2, "timer": false, "media": "media/03-b02a.mp4", "poster": "posters/03-b02a.png", "notes": "B02a · Same rule (plays, then holds on the lungs)\nWatch the rule underneath the fern.\n[As it becomes rivers] The same rule makes a coastline: rivers splitting into smaller rivers, and every bay with smaller bays inside it.\n[As it turns into lungs] Turn it over and it's inside you: a pair of lungs. One tube splitting in two, and again, and again.\n\n▶ Click: a brain cell."}, {"id": "B02b", "sceneId": "slide-b02b", "title": "Same rule", "startFrame": 606, "endFrame": 678, "frames": 72, "duration": 2.4, "timer": false, "media": "media/04-b02b.mp4", "poster": "posters/04-b02b.png", "notes": "B02b · A brain cell\nAnd it's the cell you're thinking with right now. It branches the same way, gathers signals, and passes one on.\nA second thought is that loop on purpose: your own thinking, fed back in.\n\n▶ Click: Now, AI."}, {"id": "B02c", "sceneId": "slide-b02c", "title": "Same rule", "startFrame": 678, "endFrame": 808, "frames": 130, "duration": 4.333333333333333, "timer": false, "media": "media/05-b02c.mp4", "poster": "posters/05-b02c.png", "notes": "B02c · Now, AI\nNow, AI.\nIt's loosely modelled on those cells: layers of simple connections.\nIt makes a guess, checks how far off it was, adjusts its connections, and goes round again.\nThe same rule, applied to its own output.\n\n▶ Click: the turn."}, {"id": "B03", "sceneId": "slide-b03", "title": "The turn", "startFrame": 808, "endFrame": 868, "frames": 60, "duration": 2.0, "timer": false, "media": "media/06-b03.mp4", "poster": "posters/06-b03.png", "notes": "B03 · The turn\nIf the machine recurses on knowledge, the value isn't in knowing.\n[Pause. Let it land. This slide is meant to be still.]\nAnd it's not just me saying that.\n\n▶ Click: Seymour Papert."}, {"id": "B04a", "sceneId": "slide-b04a", "title": "Seymour", "startFrame": 868, "endFrame": 1288, "frames": 420, "duration": 14.0, "timer": false, "media": "media/07-b04a.mp4", "poster": "posters/07-b04a.png", "notes": "B04a · Seymour Papert\nThis is Seymour Papert.\nI learnt to code visually through Turtle Art. It allowed me to understand recursion in a way I couldn't through the mathematics alone.\n[Let his portrait draw first. Follow its line into the recursive tree. Use the visual to tell your own learning story; save the Lineage introduction for the next scene.]\n\n▶ Click: the Lineage card activity."}, {"id": "B04b", "sceneId": "slide-b04b", "title": "Lineage", "startFrame": 1288, "endFrame": 1888, "frames": 600, "duration": 20.0, "timer": false, "media": "media/08-b04b.mp4", "poster": "posters/08-b04b.png", "notes": "B04b · Lineage · Card activity\n[Let the portrait-and-tree line become the tangled pattern and resolve into a card back. Introduce Lineage after the card is recognisable, then explain the activity as the text arrives.]\nIn your groups, shuffle the cards and lay out ten cards face down.\nTwo of those ten cards are our jokers: Elon Musk and Rick Rubin.\nTake turns turning over the cards.\n[Let the sequential card flips demonstrate taking turns; the cards then return face down. Hold while the groups do the activity. Point to the highlighted word turns. The link to LLM turns is for your later explanation; do not introduce an extra scoring rule, stopping rule or reveal it automatically.]\n\n▶ Click: MIT."}, {"id": "B04", "sceneId": "slide-b04", "title": "Watershed", "startFrame": 1888, "endFrame": 2068, "frames": 180, "duration": 6.0, "timer": false, "media": "media/09-b04.mp4", "poster": "posters/09-b04.png", "notes": "B04 · Watershed\n[Let the top-left Lineage card grow and flip into the MIT paper. Begin the next concept once the poster has opened and its quote arrives.]\nIn August, MIT's president, Sally Kornbluth, wrote to her whole community that AI in education is a watershed moment for MIT.\nAnd she quoted her own AI committee: responding to it is not an optional exercise.\nTheir report points to three things: education that is AI-aware, people and community, and continuous reflection.\n\n▶ Click: what MIT's students say."}, {"id": "B05a", "sceneId": "slide-b05a", "title": "Three numbers", "startFrame": 2068, "endFrame": 2130, "frames": 62, "duration": 2.066666666666667, "timer": false, "media": "media/10-b05a.mp4", "poster": "posters/10-b05a.png", "notes": "B05a · Three numbers\nHere's what MIT's own undergraduates said, in a survey by The Tech, their student paper, late last year.\n46 per cent use an AI chatbot every day.\n90 per cent worry they're becoming over-reliant on it.\n\n▶ Click: the third number."}, {"id": "B05b", "sceneId": "slide-b05b", "title": "Three numbers", "startFrame": 2130, "endFrame": 2188, "frames": 58, "duration": 1.9333333333333333, "timer": false, "media": "media/11-b05b.mp4", "poster": "posters/11-b05b.png", "notes": "B05b · The third number\nAnd only 25 per cent think MIT is preparing them to use AI.\n[Pause.]\nThat's MIT. It's worth asking how our students would answer.\n\n▶ Click: so what do we teach?"}, {"id": "B05Ta", "sceneId": "slide-b05ta", "title": "So we teach", "startFrame": 2188, "endFrame": 2242, "frames": 54, "duration": 1.8, "timer": false, "media": "media/12-b05ta.mp4", "poster": "posters/12-b05ta.png", "notes": "B05Ta · So we teach\nSo what do we teach?\nThinking routines.\nAnd creativity.\nThat's where the value is now.\n\n▶ Click: why we start with reflection."}, {"id": "B05Tb", "sceneId": "slide-b05tb", "title": "So we teach", "startFrame": 2242, "endFrame": 2294, "frames": 52, "duration": 1.7333333333333334, "timer": false, "media": "media/13-b05tb.mp4", "poster": "posters/13-b05tb.png", "notes": "B05Tb · Why we start with reflection\nThis is why we start with reflection: to find the problems worth solving, before anyone touches a tool.\n\n▶ Click: the loop we'll run today."}, {"id": "B05L", "sceneId": "slide-b05l", "title": "The loop, first", "startFrame": 2294, "endFrame": 2390, "frames": 96, "duration": 3.2, "timer": false, "media": "media/14-b05l.mp4", "poster": "posters/14-b05l.png", "notes": "B05L · The loop, first\nHere's the loop we'll run today, twice.\nFind a barrier. Sketch it. Write the prompt. Build it. Test it. Then go round again.\nHold on to this shape. You'll see it again at the end.\n\n▶ Click: the question."}, {"id": "B06", "sceneId": "slide-b06", "title": "The question", "startFrame": 2390, "endFrame": 2450, "frames": 60, "duration": 2.0, "timer": false, "media": "media/15-b06.mp4", "poster": "posters/15-b06.png", "notes": "B06 · The question\nHoma Tavangar puts it this way: the question is no longer \"What do you know?\"\nIt's this.\nWhat problems do you want to solve?\n[Pause.]\n\n▶ Click: two kinds of problem."}, {"id": "B07-1", "sceneId": "slide-b07-1", "title": "Algorithmic vs heuristic", "startFrame": 2450, "endFrame": 2564, "frames": 114, "duration": 3.8, "timer": false, "media": "media/16-b07-1.mp4", "poster": "posters/16-b07-1.png", "notes": "B07-1 · Algorithmic vs heuristic\nThere are two kinds of problem.\nAlgorithmic problems have a known procedure. Follow the steps, get the answer.\nHeuristic problems don't. There's no procedure, just rules of thumb, judgment and trial. You know you've arrived when you look at it.\n\n▶ Click: which one AI has eaten."}, {"id": "B07-2", "sceneId": "slide-b07-2", "title": "Algorithmic vs heuristic", "startFrame": 2564, "endFrame": 2620, "frames": 56, "duration": 1.8666666666666667, "timer": false, "media": "media/17-b07-2.mp4", "poster": "posters/17-b07-2.png", "notes": "B07-2 · The payoff\nAI has eaten the first kind.\nAnd every hard problem in your classroom is on the right.\nThat's why nobody has built the tool you need, and why you're the only one who can.\n\n▶ Click: Rick Rubin."}, {"id": "B07a", "sceneId": "slide-b07a", "title": "Rick Rubin", "startFrame": 2620, "endFrame": 2980, "frames": 360, "duration": 12.0, "timer": false, "media": "media/18-b07a.mp4", "poster": "posters/18-b07a.png", "notes": "B07a · Rick Rubin\n[Follow the heuristic line as it continues into Rick Rubin's portrait. Explain his relationship to vibe coding in your own words; then connect Automate, WebApp and Agents to the three workshop exercises.]\n[Background source for preparation: Rick Rubin's The Way of Code, https://www.thewayofcode.com/ . The portrait and story reference are retained from the Lineage project.]\n\n▶ Click: warm-up, Round 1 — through the existing ribbon transition."}, {"id": "B08", "sceneId": "slide-b08", "title": "Round 1", "startFrame": 2980, "endFrame": 3052, "frames": 72, "duration": 2.4, "timer": false, "media": "media/19-b08.mp4", "poster": "posters/19-b08.png", "notes": "B08 · Round 1\nLet's warm up. This comes from Creative Hustle, by Olatunde Sobomehin and Sam Seidel.\nWrite the most ridiculous word you can think of.\nNow stand up and find someone you don't work with.\nPitch them a product with that name. You have three minutes.\n\n▶ Click: start the three-minute Round 1 timer."}, {"id": "B08a", "sceneId": "slide-b08a", "title": "Round 1 timer", "startFrame": 3052, "endFrame": 8468, "frames": 5416, "duration": 180.53333333333333, "timer": true, "media": "media/20-b08a.mp4", "poster": "posters/20-b08a.png", "notes": "B08a · Round 1 timer\n[The persistent step-three reminder reads: Pitch a product with that name.]\n[The countdown runs from 03:00 to 00:00 over exactly 180 seconds. Give the room the full activity time. The completed picture and 00:00 hold until you advance.]\n[The wordless line moves through the song’s imagery, then finishes on Jay-Z’s face from the supplied reference. Background music: the supplied 99 Problems instrumental, cropped to the first three minutes, with a two-second fade to silence at the end.]\n\n▶ Click: Round 2."}, {"id": "B09", "sceneId": "slide-b09", "title": "Round 2", "startFrame": 8468, "endFrame": 8528, "frames": 60, "duration": 2.0, "timer": false, "media": "media/21-b09.mp4", "poster": "posters/21-b09.png", "notes": "B09 · Round 2\nRound 2. Now write your real classroom problem, in one sentence.\nFind a new partner. Pitch each other a solution. You have four minutes.\n\n▶ Click: start the four-minute Round 2 timer."}, {"id": "B09a", "sceneId": "slide-b09a", "title": "Round 2 timer", "startFrame": 8528, "endFrame": 15742, "frames": 7214, "duration": 240.46666666666667, "timer": true, "media": "media/22-b09a.mp4", "poster": "posters/22-b09a.png", "notes": "B09a · Round 2 timer\n[The countdown runs from 04:00 to 00:00 over exactly 240 seconds. The third instruction remains visible: Pitch each other a solution. Give the room the full activity time, then bring everyone back to their seats.]\n[The line moves through city and bridge imagery and resolves into the supplied Red Hot Chili Peppers illustration. The supplied Under the Bridge instrumental plays for four minutes, with a two-second closing fade.]\n\n▶ Click: deficit."}, {"id": "B10-1", "sceneId": "slide-b10-1", "title": "Deficit", "startFrame": 15742, "endFrame": 15796, "frames": 54, "duration": 1.8, "timer": false, "media": "media/23-b10-1.mp4", "poster": "posters/23-b10-1.png", "notes": "B10-1 · Deficit\nHere's how most of us write a problem down:\nThey can't organise their writing.\nThat's a deficit. It lives in the student.\n\n▶ Click: the same problem as a barrier."}, {"id": "B10-2", "sceneId": "slide-b10-2", "title": "Barrier", "startFrame": 15796, "endFrame": 15922, "frames": 126, "duration": 4.2, "timer": false, "media": "media/24-b10-2.mp4", "poster": "posters/24-b10-2.png", "notes": "B10-2 · Barrier\nNow the same thing as a barrier:\nThe organising has to happen in their head at the same time as the writing.\nSame student. Different problem. Only one of them is yours to fix.\n[Optional: it's the same move as our UDL work. The barrier is in the design, not the learner.]\n\n▶ Click: introduce Apple Shortcuts."}, {"id": "B10a", "sceneId": "slide-b10a", "title": "Apple Shortcuts", "startFrame": 15922, "endFrame": 16042, "frames": 120, "duration": 4.0, "timer": false, "media": "media/25-b10a.mp4", "poster": "posters/25-b10a.png", "notes": "B10a · Apple Shortcuts\n[Introduce Apple Shortcuts as the first tool, connecting it to Automate from the opening. Use the supplied screenshot in the MacBook frame. The ribbon arrow points to the right-hand “What do you want your shortcut to do?” panel.]\n\n▶ Click: the student notetaking example."}, {"id": "B10b", "sceneId": "slide-b10b", "title": "Student notetaking", "startFrame": 16042, "endFrame": 16192, "frames": 150, "duration": 5.0, "timer": false, "media": "media/26-b10b.mp4", "poster": "posters/26-b10b.png", "notes": "B10b · Student notetaking\n[Show the example you created in Shortcuts to support student notetaking. The left iPad shows the notes output, the centre iPad shows the Class Notes shortcut, and the right iPad shows the notes share sheet with Class Notes.]\n\n▶ Click: your turn."}, {"id": "B11", "sceneId": "slide-b11", "title": "Your turn", "startFrame": 16192, "endFrame": 16291, "frames": 99, "duration": 3.3, "timer": false, "media": "media/27-b11.mp4", "poster": "posters/27-b11.png", "notes": "B11 · Your turn\nYour turn. Take your one-sentence problem from Round 2 and rewrite it with this template:\nBlank can't blank. The blank has to happen at the same time as blank.\nThen sketch it. Three minutes. Boxes and arrows.\nAnswer three questions:\nWhat does the student see first?\nWhat can they do on it?\nWhat happens when they tap?\n[Use the next scene’s three-minute timer.]\n\n▶ Click: start the sketch timer."}, {"id": "B11a", "sceneId": "slide-b11a", "title": "Sketch timer", "startFrame": 16291, "endFrame": 21706, "frames": 5415, "duration": 180.5, "timer": true, "media": "media/28-b11a.mp4", "poster": "posters/28-b11a.png", "notes": "B11a · Sketch timer\n[Give the room the full three minutes to sketch. The reminder reads: Sketch it. Boxes and arrows.]\n[The supplied Shape of You instrumental accompanies the countdown. Wordless line imagery resolves into Ed Sheeran’s portrait from the supplied reference. The music fades during the last two seconds, then the completed frame holds until you advance.]\n\n▶ Click: your prompt."}, {"id": "B13", "sceneId": "slide-b13", "title": "Prompt spine", "startFrame": 21706, "endFrame": 21766, "frames": 60, "duration": 2.0, "timer": false, "media": "media/29-b13.mp4", "poster": "posters/29-b13.png", "notes": "B13 · Prompt spine\nThis is your prompt. Fill in the blanks from your sketch:\nBuild a single-screen tool for a Grade blank student who blank.\nShow blank first, then let them blank.\nKeep the language at blank. No sign-in.\nWrite it down. You'll paste it in a minute, and it stays on the build slide too.\n\n▶ Click: examples."}, {"id": "B14", "sceneId": "slide-b14", "title": "Examples", "startFrame": 21766, "endFrame": 21856, "frames": 90, "duration": 3.0, "timer": false, "media": "media/30-b14.mp4", "poster": "posters/30-b14.png", "notes": "B14 · Examples\nHere are examples of what we can explore: interactives, explainer videos and Agentic updates.\nAnd your materials are the boundary: it works from what you give it.\nToday we will explore a small Web App. We are not promising a completed app.\n\n[Before you go on, pair up. Say what it's for before anyone moves: everyone works with someone whose habits are different from theirs.\nHave everyone line up by how much of their week already runs through an AI tool: \"never\" at one end, \"it's in everything\" at the other.\nThen fold the line: the front person pairs with the back, second with second-last.]\n\n▶ Click: chatbots and Gemini."}, {"id": "B14a", "sceneId": "slide-b14a", "title": "Gemini", "startFrame": 21856, "endFrame": 21976, "frames": 120, "duration": 4.0, "timer": false, "media": "media/31-b14a.mp4", "poster": "posters/31-b14a.png", "notes": "B14a · Chatbots · Gemini\nIntroduce chatbots using Gemini as the presenter's chosen example.\n[Supplied Gemini screenshot: Turtle Art coding-platform prompt and generated artifact.]\n\n▶ Click: Biology example."}, {"id": "B14B", "sceneId": "slide-b14b", "title": "Biology", "startFrame": 21976, "endFrame": 22156, "frames": 180, "duration": 6.0, "timer": false, "media": "media/32-b14b.mp4", "poster": "posters/32-b14b.png", "notes": "B14B · Biology\nHere's what this can look like when you keep going.\nThis is a Grade 9 biology resource I built: the readings, a glossary that shows how the words connect, and a body index.\nIt's at dbbudd.github.io/biology if you want to explore it later.\nYou're not building this today. You're building the first, smallest version of yours.\n\n▶ Click: BUILD 01."}, {"id": "B15", "sceneId": "slide-b15", "title": "Build 01", "startFrame": 22156, "endFrame": 22216, "frames": 60, "duration": 2.0, "timer": false, "media": "media/33-b15.mp4", "poster": "posters/33-b15.png", "notes": "B15 · BUILD 01 · Web App · 15 minutes\nFifteen minutes to build a Web App.\nOne of you drives, one of you talks. Your prompt is bottom left.\nYour first version will be wrong. That's the point. Go.\n[The next board has the matching fifteen-minute timer and supplied FOLHK music mix.]\n\n▶ Click: build timer."}, {"id": "B15a", "sceneId": "slide-b15a", "title": "Web App timer", "startFrame": 22216, "endFrame": 49232, "frames": 27016, "duration": 900.5333333333333, "timer": true, "media": "media/34-b15a.mp4", "poster": "posters/34-b15a.png", "notes": "B15a · Web App timer · 15 minutes\nOne drives. One talks.\n[Fifteen-minute timer with the full supplied FOLHK mix at its original level and speed. Song-led line imagery follows Black Skinhead, The Pretender and Dani California, finishing on the supplied three-singer portrait. The last half-second hold is quiet.]\n\n▶ Click: TEST 01."}, {"id": "B16", "sceneId": "slide-b16", "title": "Test 01", "startFrame": 49232, "endFrame": 49292, "frames": 60, "duration": 2.0, "timer": false, "media": "media/35-b16.mp4", "poster": "posters/35-b16.png", "notes": "B16 · TEST 01 · Web App · 4 minutes\nStop building. Swap devices with another pair.\nThey use it cold. You say nothing.\nWatch where they hesitate.\n[Start a 4-minute timer.]\n\n▶ Click: what it couldn't do."}, {"id": "B17", "sceneId": "slide-b17", "title": "Couldn't do", "startFrame": 49292, "endFrame": 49352, "frames": 60, "duration": 2.0, "timer": false, "media": "media/36-b17.mp4", "poster": "posters/36-b17.png", "notes": "B17 · What it couldn't do\nWith your partner: what did you want it to do that it wouldn't?\n[Give them a minute, then take answers and write them on the slide with the pen.]\n\n▶ Click: SCAMPER."}, {"id": "B17Sa", "sceneId": "slide-b17sa", "title": "Scamper", "startFrame": 49352, "endFrame": 49424, "frames": 72, "duration": 2.4, "timer": false, "media": "media/37-b17sa.mp4", "poster": "posters/37-b17sa.png", "notes": "B17Sa · SCAMPER\nHere's a tool for pushing an idea further: SCAMPER.\nSubstitute. Combine. Adapt. Modify. Put to another use. Eliminate. Reverse.\n\n▶ Click: today's three."}, {"id": "B17Sb", "sceneId": "slide-b17sb", "title": "Scamper", "startFrame": 49424, "endFrame": 49450, "frames": 26, "duration": 0.8666666666666667, "timer": false, "media": "media/38-b17sb.mp4", "poster": "posters/38-b17sb.png", "notes": "B17Sb · Today's three\nToday we'll use three of them: Substitute, Combine and Eliminate.\n\n▶ Click: the corners."}, {"id": "B18", "sceneId": "slide-b18", "title": "Three corners", "startFrame": 49450, "endFrame": 49546, "frames": 96, "duration": 3.2, "timer": false, "media": "media/39-b18.mp4", "poster": "posters/39-b18.png", "notes": "B18 · Three corners\nThis is the room from above. The bar at the top is this screen.\nEach corner is one move: Substitute, Combine, Eliminate.\nAnd if yours already works, take the fourth corner: push it.\nChange one thing.\n[Give them four minutes to swap ideas with the others in their corner; the next board manages the time.]\n\n▶ Click: four-minute activity timer."}, {"id": "B18a", "sceneId": "slide-b18a", "title": "SCAMPER timer", "startFrame": 49546, "endFrame": 56762, "frames": 7216, "duration": 240.53333333333333, "timer": true, "media": "media/40-b18a.mp4", "poster": "posters/40-b18a.png", "notes": "B18a · Four-minute SCAMPER activity\nSubstitute - Combine - Eliminate - Push It!\n[Four-minute countdown. Rolling in the Deep imagery leads to Adele from the supplied reference. The activity instruction stays visible. The supplied Rolling in the Deep instrumental plays at its original speed, fades out, and is padded with silence to complete the four minutes.]\n\n▶ Click: Web App to Agents."}, {"id": "B19a", "sceneId": "slide-b19a", "title": "Web app to agents", "startFrame": 56762, "endFrame": 56822, "frames": 60, "duration": 2.0, "timer": false, "media": "media/41-b19a.mp4", "poster": "posters/41-b19a.png", "notes": "B19a · Web App to Agents\nHere are the next three capabilities I want to demonstrate:\nAccess Local Files.\nCreate Skills.\nAutomate Workflows.\n[The three items begin under Can’t / Web App.]\n\n▶ Click: move the capabilities to Agents."}, {"id": "B19b", "sceneId": "slide-b19b", "title": "Web app to agents", "startFrame": 56822, "endFrame": 56894, "frames": 72, "duration": 2.4, "timer": false, "media": "media/42-b19b.mp4", "poster": "posters/42-b19b.png", "notes": "B19b · Agents can\n[The three capabilities move into Can / Agents, one at a time.]\nAccess Local Files. Create Skills. Automate Workflows.\n\n▶ Click: three words."}, {"id": "B12", "sceneId": "slide-b12", "title": "Three words", "startFrame": 56894, "endFrame": 57050, "frames": 156, "duration": 5.2, "timer": false, "media": "media/43-b12.mp4", "poster": "posters/43-b12.png", "notes": "B12 · Three words\nThree words before we explore Agents.\nAn app is anything you open and use. It doesn't need to be in an App Store.\nHTML is the structure: boxes, text, where things sit.\nJavaScript is the behaviour: what happens when you press the thing.\nYou write neither. You describe the behaviour.\n\n▶ Click: BUILD 02."}, {"id": "B20", "sceneId": "slide-b20", "title": "Build 02", "startFrame": 57050, "endFrame": 57110, "frames": 60, "duration": 2.0, "timer": false, "media": "media/44-b20.mp4", "poster": "posters/44-b20.png", "notes": "B20 · BUILD 02 · Agents · 8 minutes\nEight minutes, with agents. Swap roles: whoever talked now drives.\nSame barrier. More ambition.\nNobody finishes this. You're finding out if it's buildable. Go.\n[Start an 8-minute timer. Walk the room.]\n\n▶ Click: Xcode."}, {"id": "B20a", "sceneId": "slide-b20a", "title": "Xcode", "startFrame": 57110, "endFrame": 57230, "frames": 120, "duration": 4.0, "timer": false, "media": "media/45-b20a.mp4", "poster": "posters/45-b20a.png", "notes": "B20a · Agents · Xcode\nIntroduce Agents using Xcode.\n[Supplied Xcode screenshot: Margins project and Coding Intelligence / Agents settings.]\n\n▶ Click: Copilot."}, {"id": "B20b", "sceneId": "slide-b20b", "title": "Copilot", "startFrame": 57230, "endFrame": 57350, "frames": 120, "duration": 4.0, "timer": false, "media": "media/46-b20b.mp4", "poster": "posters/46-b20b.png", "notes": "B20b · Agents · Copilot\nIntroduce Agents using Copilot.\n[Supplied Copilot screenshot: creating an HKIS HyperFrames personal skill in OneDrive.]\n\n▶ Click: DeepSeek."}, {"id": "B20c", "sceneId": "slide-b20c", "title": "DeepSeek", "startFrame": 57350, "endFrame": 57470, "frames": 120, "duration": 4.0, "timer": false, "media": "media/47-b20c.mp4", "poster": "posters/47-b20c.png", "notes": "B20c · Agents · DeepSeek\nIntroduce Agents using DeepSeek.\n[Supplied DeepSeek Harness screenshot: Margins app running in the simulator beside the agent conversation.]\n\n▶ Click: Margins."}, {"id": "B21", "sceneId": "slide-b21", "title": "Margins", "startFrame": 57470, "endFrame": 57650, "frames": 180, "duration": 6.0, "timer": false, "media": "media/48-b21.mp4", "poster": "posters/48-b21.png", "notes": "B21 · Margins\nOne example of where this goes.\nThis is Margins. I built this because I saw how ELA teachers struggled with grading workflows.\nThe AI runs on the iPad itself. The writing never leaves the iPad.\n\n▶ Click: the third rung."}, {"id": "B22", "sceneId": "slide-b22", "title": "The third rung", "startFrame": 57650, "endFrame": 57760, "frames": 110, "duration": 3.6666666666666665, "timer": false, "media": "media/49-b22.mp4", "poster": "posters/49-b22.png", "notes": "B22 · The third rung\nAutomate. Then Web App.\nThe third rung is Agents: Copilot, DeepSeek and Xcode.\nUp there, the tool stops being the limit.\nYou become the limit.\n\n▶ Click: Build 02."}, {"id": "B22a", "sceneId": "slide-b22a", "title": "Build 02", "startFrame": 57760, "endFrame": 57880, "frames": 120, "duration": 4.0, "timer": false, "media": "media/50-b22a.mp4", "poster": "posters/50-b22a.png", "notes": "B22a · Build 02\nSame barrier. More ambition.\nContinue iterating.\n[The 8 turns sideways, then a red line crosses out minutes. Hold this board while the room continues.]\n\n▶ Click: the loop."}, {"id": "B23", "sceneId": "slide-b23", "title": "The loop", "startFrame": 57880, "endFrame": 58060, "frames": 180, "duration": 6.0, "timer": false, "media": "media/51-b23.mp4", "poster": "posters/51-b23.png", "notes": "B23 · The loop\nRemember this loop? Barrier. Sketch. Prompt. Build. Test.\nYou just ran this twice.\nRun it again Monday.\n\n▶ Click: the question."}, {"id": "B24", "sceneId": "slide-b24", "title": "What next", "startFrame": 58060, "endFrame": 58109, "frames": 49, "duration": 1.6333333333333333, "timer": false, "media": "media/52-b24.mp4", "poster": "posters/52-b24.png", "notes": "B24 · What next\nSo:\nWhat problem do you want to solve next?\n[Pause. Let it sit.]\n\n[Last slide. Hold this question on screen.]"}], "playerVersion": "0.8.81"};window.__timelines=window.__timelines||{};window.__timelines["slide-b00"]=gsap.timeline({paused:true}).to({},{duration:520});</script><script src="frame-player.js?v=20261106-motion"></script></body></html>
